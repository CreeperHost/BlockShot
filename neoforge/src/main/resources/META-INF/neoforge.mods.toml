modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
#issueTrackerURL = ""
license = "${license}"

[[mods]]
    modId = "blockshot"
    version = "${version}"
    displayName = "${mod_name}"
    authors = "${mod_author}"
    credits = "${credits}"
    description = '''${description}'''
    #logoFile = ""

[[dependencies.blockshot]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.blockshot]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.blockshot]]
    modId = "polylib"
    type="required"
    versionRange = "[${polylib_mod_version},)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "blockshot.mixins.json"
