plugins {
    id "com.gradleup.shadow" version "9.2.2"
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id "me.shedaniel.unified-publishing"
}

def ENV = System.getenv()

neoForge {
    version = neoforge_version
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation("net.creeperhost.polylib:polylib-neoforge:${polylib_version}") { transitive = false }
    accessTransformers("net.creeperhost.polylib:polylib-neoforge:${polylib_version}")

    implementation("net.creeperhost:jcodec:0.2.6") { transitive = false }
    implementation("net.creeperhost:MineTogetherSessions:${mtsession_version}") { transitive = false }
    implementation("net.creeperhost:MineTogetherLib:${mtlib_version}") { transitive = false }
    implementation("net.covers1624:Quack:${quack_version}") { transitive = false }

    shadow("net.creeperhost:jcodec:0.2.6") { transitive = false }
    shadow("net.creeperhost:MineTogetherSessions:${mtsession_version}") { transitive = false }
    shadow("net.creeperhost:MineTogetherLib:${mtlib_version}") { transitive = false }
    shadow("net.covers1624:Quack:${quack_version}") { transitive = false }
}

shadowJar {
    dependsOn(jar)
    configurations = [project.configurations.shadow]
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    exclude "fabric.mod.json"
    mergeServiceFiles()

    dependencies {
        exclude(dependency('com.google::'))
        exclude(dependency('org.apache::'))
    }
    relocate 'com.squareup.gifencoder', 'net.creeperhost.blockshot.com.squareup.gifencoder'
    relocate 'org.jcodec', 'net.creeperhost.blockshot.repack.org.jcodec'
    relocate 'net.sourceforge.jaad', 'net.creeperhost.blockshot.repack.net.sourceforge.jaad'
    relocate 'net.creeperhost.minetogether.lib', 'net.creeperhost.blockshot.repack.minetogether.lib'
    relocate 'net.creeperhost.minetogether.session', 'net.creeperhost.blockshot.repack.net.creeperhost.minetogether.session'
    relocate 'net.covers1624.quack', 'net.creeperhost.blockshot.repack.covers1624.quack'
    archiveClassifier = null
}

jar {
    archiveClassifier = 'dev'
}

configurations {
    [apiElements, runtimeElements].each { config ->
        config.outgoing.artifacts.clear()
        config.outgoing.artifact(shadowJar)
    }
}

assemble.dependsOn(shadowJar)

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

publishing {
    publications {
        named('mavenJava', MavenPublication) {
            artifactId = rootProject.archives_base_name + "-neoforge"
            version = "${rootProject.minecraft_version}-${rootProject.version}"
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        if (ENV.CREEPERHOST_MAVEN_TOKEN) {
            maven {
                url "https://maven.creeperhost.net/release"
                credentials {
                    username = "githubci"
                    password = "${ENV.CREEPERHOST_MAVEN_TOKEN}"
                }
            }
        }
    }
}

unifiedPublishing {
    project {
        displayName = "$rootProject.version [NeoForge]"
        releaseType = "$rootProject.artifact_type"
        changelog = ""
        gameVersions = ["$rootProject.minecraft_version"]
        gameLoaders = ["neoforge"]
        mainPublication tasks.shadowJar
        relations {
            depends {
                curseforge = "polylib"
                modrinth = "polylib"
            }
        }

        var CURSE_API_KEY = project.findProperty("CURSE_API_KEY") ?: System.getenv("CURSE_API_KEY")
        if (CURSE_API_KEY != null) {
            curseforge {
                token = CURSE_API_KEY
                id = rootProject.curseforge_id
            }
        }

        var MODRINTH_TOKEN = project.findProperty("MODRINTH_TOKEN") ?: System.getenv("MODRINTH_TOKEN")
        if (MODRINTH_TOKEN != null) {
            modrinth {
                token = MODRINTH_TOKEN
                id = rootProject.modrinth_id
                version = "$project.version"
            }
        }
    }
}
