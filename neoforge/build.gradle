plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "me.shedaniel.unified-publishing"
}

def ENV = System.getenv()

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        clientLogin {
            client()
            ideConfigGenerated true
            mainClass.set 'net.covers1624.devlogin.DevLogin'

            programArgs '--launch_target', 'cpw.mods.bootstraplauncher.BootstrapLauncher'
        }
    }
}

architectury {
    platformSetupLoomIde()
    neoForge {
        platformPackage = "neoforge"
    }
}

configurations {
    common
    shadowLib
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    shadowCommon.extendsFrom shadowLib
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    implementation.extendsFrom shadowLib
    forgeRuntimeLibrary.extendsFrom shadowLib
}

dependencies {
    neoForge("net.neoforged:neoforge:${rootProject.neoforge_version}")
    modApi("dev.architectury:architectury-neoforge:${rootProject.architectury_version}")
    modApi("net.creeperhost:polylib-neoforge:${polylib_version}") { transitive = false }

    modApi ("dev.ftb.mods:ftb-pause-menu-api:21.1.0:api") {
        transitive false
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    shadowLib('net.creeperhost:jcodec:0.2.6') { transitive = false }
    shadowLib ("net.covers1624:Quack:${quack_version}") { transitive = false }
    shadowLib("net.creeperhost:MineTogetherSessions:${mtsession_version}") { transitive = false }
    shadowLib ("net.creeperhost:MineTogetherLib:${mtlib_version}") { transitive = false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"

    relocate 'com.squareup.gifencoder', 'net.creeperhost.blockshot.com.squareup.gifencoder'
    relocate 'org.jcodec', 'net.creeperhost.blockshot.repack.org.jcodec'
    relocate 'net.sourceforge.jaad', 'net.creeperhost.blockshot.repack.net.sourceforge.jaad'
    relocate 'net.creeperhost.minetogether.lib', 'net.creeperhost.blockshot.repack.minetogether.lib'
    relocate 'net.creeperhost.minetogether.session', 'net.creeperhost.blockshot.repack.net.creeperhost.minetogether.session'
    relocate 'net.covers1624.quack', 'net.creeperhost.blockshot.repack.covers1624.quack'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveBaseName.set "${rootProject.archives_base_name}-${project.name}-${rootProject.minecraft_version}"
    archiveClassifier = null
    atAccessWideners.add('blockshot.accesswidener')
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoforge(MavenPublication) {
            artifactId = rootProject.archivesBaseName + "-neoforge"
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        if (ENV.CREEPERHOST_MAVEN_TOKEN) {
            maven {
                url "https://maven.creeperhost.net/release"
                credentials {
                    username = "githubci"
                    password = "${ENV.CREEPERHOST_MAVEN_TOKEN}"
                }
            }
        }
    }
}

unifiedPublishing {
    project {
        displayName = "${ENV.GITHUB_REF_NAME} [NeoForge]"
        releaseType = "$rootProject.artifact_type"
        changelog = ""
        gameVersions = [rootProject.minecraft_version, "1.21.1"]
        gameLoaders = ["neoforge"]
        mainPublication tasks.remapJar
        relations {
            depends {
                curseforge = "polylib"
                modrinth = "polylib"
            }
        }

        var CURSE_API_KEY = project.findProperty("CURSE_API_KEY") ?: System.getenv("CURSE_API_KEY")
        if (CURSE_API_KEY != null) {
            curseforge {
                token = CURSE_API_KEY
                id = rootProject.curseforge_id
                gameVersions.addAll rootProject.minecraft_version
            }
        }

//        var MODRINTH_TOKEN = project.findProperty("MODRINTH_TOKEN") ?: System.getenv("MODRINTH_TOKEN")
//        if (MODRINTH_TOKEN != null) {
//            modrinth {
//                token = MODRINTH_TOKEN
//                id = rootProject.modrinth_id
//                version = "$project.version"
//            }
//        }
    }
}