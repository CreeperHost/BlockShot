buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.creeperhost.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
plugins {
    id "com.github.johnrengelman.shadow" version "4.0.4"
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.5.1'
group = 'net.creeperhost.blockshot'
archivesBaseName = "blockshot-forge-1.12.2"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.creeperhost.net/' }
    mavenCentral()
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}
configurations {
    shadow
    compile.extendsFrom shadow
    all {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j18-impl'
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    shadow ("net.creeperhost:jcodec:0.2.6") { transitive = false }
    shadow ("net.creeperhost:MineTogetherSessions:1.2.6") { transitive = false }
}
jar {
    classifier 'base'
    manifest {
        attributes([
            "Specification-Title": "blockshot",
            "Specification-Vendor": "CreeperHost",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"CreeperHost",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
shadowJar {
    configurations = [project.configurations.shadow]
    classifier ''
    relocate 'org.jcodec', 'net.creeperhost.blockshot.repack.org.jcodec'
}

reobf {
    shadowJar {} // Reobfuscate the shadowed JAR
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property 'version', project.version

    // replace stuff in mods.toml, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version':project.version, 'mcversion':'1.12.2'
    }

    // copy everything else except the mods.toml
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

artifacts {
    archives shadowJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
