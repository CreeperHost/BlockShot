name: Publish release

on:
  push:
    tags:
      - '26.3-*'

permissions:
  contents: write

concurrency:
  group: blockshot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSE_API_KEY }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')"
          mod_version="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')"
          curseforge_id="$(sed -n 's/^curseforge_id=//p' gradle.properties | tr -d '\r')"
          modrinth_id="$(sed -n 's/^modrinth_id=//p' gradle.properties | tr -d '\r')"
          test "${GITHUB_REF_NAME}" = "${minecraft_version}-${mod_version}"
          test -n "${curseforge_id}"
          test -n "${modrinth_id}"
          test -n "${CURSEFORGE_TOKEN}"
          test -n "${MODRINTH_TOKEN}"
          echo "CURSEFORGE_PROJECT_ID=${curseforge_id}" >> "${GITHUB_ENV}"
          echo "MODRINTH_PROJECT_ID=${modrinth_id}" >> "${GITHUB_ENV}"

      - name: Add marketplace identities to release metadata
        shell: bash
        run: |
          set -euo pipefail
          jq --arg curseforge "${CURSEFORGE_PROJECT_ID}" \
             --arg modrinth "${MODRINTH_PROJECT_ID}" \
             '.projects.curseforge = $curseforge |
              .projects.modrinth = $modrinth |
              .preferredDownload = "curseforge"' \
             .modpacksch.json > .modpacksch.release.json
          mv .modpacksch.release.json .modpacksch.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test and publish
        run: |
          chmod +x ./gradlew
          ./gradlew buildAll publishMods --no-daemon

      - name: Publish to CreeperHost Maven
        env:
          CREEPERHOST_MAVEN_TOKEN: ${{ secrets.CREEPERHOST_MAVEN_TOKEN }}
        run: |
          if [ -n "${CREEPERHOST_MAVEN_TOKEN}" ]; then
            ./gradlew :fabric:publish :neoforge:publish --no-daemon
          fi
